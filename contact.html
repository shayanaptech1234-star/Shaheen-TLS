<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Shaheen TLS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="index.html" class="logo-container">
        <img src="WhatsApp Image 2025-12-23 at 11.14.36 PM.jpeg" alt="Shaheen TLS Logo" class="logo-img">
    </a>

    <div class="mobile-menu-btn" onclick="toggleMobileMenu()">
        <i class="fa-solid fa-bars"></i>
    </div>

    <nav class="nav-links" id="navLinks">
        <a href="index.html" class="desktop-only">Home</a>
        <a href="product.html" class="desktop-only">Products</a>
        <a href="#" class="desktop-only active">Contact</a>

        <a href="index.html" class="mobile-only">Home</a>
        <a href="contact.html" class="mobile-only">Contact</a>
        <a href="product.html" class="mobile-only">Products</a>
    </nav>
</header>

<main class="container" style="margin-top: 50px; max-width: 800px;">
    <section class="section-header" style="text-align: center; margin-bottom: 40px;">
        <h1>Get in Touch</h1>
        <p>Have questions about our leveling systems? We're here to help.</p>
    </section>

    <div class="card" style="padding: 30px;">
        <form id="contactForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" placeholder="Enter name" required style="width:100%; padding:12px; border:1px solid var(--border); border-radius:8px;">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="+971..." required style="width:100%; padding:12px; border:1px solid var(--border); border-radius:8px;">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label>Message</label>
                <textarea rows="5" placeholder="How can we help you?" required style="width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; font-family: inherit;"></textarea>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
                <i class="fa-solid fa-paper-plane"></i> Send Message
            </button>
        </form>
    </div>

    <div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; text-align: center;">
        <div>
            <i class="fa-solid fa-envelope" style="color: var(--primary); font-size: 1.5rem; margin-bottom: 10px;"></i>
            <h4>Email Us</h4>
            <p>sales@shaheentls.com</p>
        </div>
        <div>
            <i class="fa-solid fa-location-dot" style="color: var(--primary); font-size: 1.5rem; margin-bottom: 10px;"></i>
            <h4>Location</h4>
            <p>Dubai, United Arab Emirates</p>
        </div>
    </div>
</main>

<script>
    // Simple Mobile Toggle for this page
    function toggleMobileMenu() {
        const nav = document.getElementById('navLinks');
        nav.classList.toggle('active');
    }

    // Optional: Form submission handling
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Thank you! Your message has been sent to sales@shaheentls.com');
        this.reset();
    });
</script>

</body>
</html>
